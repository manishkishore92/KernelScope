[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelscope"
version = "0.3.0"
description = "Android kernel inspection and build assistant for ROM maintainers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Manish Kishore"}
]
keywords = ["android", "kernel", "custom-rom", "defconfig", "dts", "gki", "kmi", "cli", "anykernel", "android-kernel"]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
kernelscope = "kernelscope.cli:app"

[tool.setuptools.packages.find]
include = ["kernelscope*"]

[tool.setuptools.package-data]
kernelscope = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
